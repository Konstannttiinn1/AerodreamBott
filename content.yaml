start: |
  Привет! Это официальный бот Aerodream в Санкт-Петербурге.
  Мы помогаем познакомиться с полетами в аэротрубе, ответить на вопросы и связать с администратором.

menu_hint: "Выберите раздел из меню ниже."

about: |
  🏁 Aerodream — современная аэротруба в Санкт-Петербурге.
  Здесь вы можете испытать полет как в свободном падении, без парашюта и сложной подготовки.
  Полеты подходят новичкам и тем, кто хочет улучшить навыки.

faq_intro: "Выберите вопрос:"

faq:
  - question: "С какого возраста можно летать?"
    answer: "Мы принимаем гостей от 5 лет. Детям нужен сопровождающий взрослый."
  - question: "Нужна ли специальная подготовка?"
    answer: "Нет. Перед полетом проводится инструктаж и выдаются все необходимые элементы экипировки."
  - question: "Сколько длится полет?"
    answer: "Обычно полет длится 1–2 минуты, в зависимости от тарифа."
  - question: "Что взять с собой?"
    answer: "Удобную спортивную одежду и чистую обувь. Остальное мы выдадим на месте."
  - question: "Можно ли подарить полет?"
    answer: "Да, мы поможем подобрать подарочный формат. Напишите администратору."
  - question: "Есть ли парковка?"
    answer: "Да, рядом с локацией есть парковочные места."
  - question: "Можно ли сделать фото или видео?"
    answer: "Да, мы предлагаем фото/видео сопровождение. Уточните детали у администратора."
  - question: "Какие противопоказания?"
    answer: "Полет не рекомендуется при травмах, проблемах с давлением и беременности."

prices: |
  💳 Цены и тарифы:
  1) Старт — 1 минута полета + инструктаж.
  2) Комфорт — 2 минуты полета + экипировка.
  3) Премиум — 3 минуты полета + фото/видео.

map: |
  📍 Как добраться:
  Адрес: Санкт-Петербург, примерный адрес Aerodream.
  Ориентиры: рядом с большим торговым центром.
  Навигация: используйте карту по ссылке на сайте.

rules: |
  📋 Подготовка и правила:
  • Приходите за 20 минут до сеанса.
  • Наденьте удобную спортивную одежду.
  • Следуйте инструкциям тренера.
  • Нельзя летать в состоянии недомогания.

contacts: |
